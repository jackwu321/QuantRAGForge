[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_llm_wiki"
version = "0.2.0"
description = "AI-powered quant research knowledge base & brainstorm agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jackwu321"}]
keywords = [
    "quant",
    "knowledge-base",
    "wiki",
    "llm",
    "rag",
    "langgraph",
    "chromadb",
    "research",
    "brainstorm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.4.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/jackwu321/Quant_LLM_Wiki"
Repository = "https://github.com/jackwu321/Quant_LLM_Wiki"
Issues = "https://github.com/jackwu321/Quant_LLM_Wiki/issues"
Changelog = "https://github.com/jackwu321/Quant_LLM_Wiki/releases"

[project.scripts]
qlw = "quant_llm_wiki.cli:main"

[tool.setuptools.packages.find]
include = ["quant_llm_wiki*"]
